<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galaxy of Love 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050005;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .overlay-card {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 0, 15, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 105, 180, 0.3);
      border-radius: 16px;
      padding: 15px 25px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
      max-width: 90%;
      width: 400px;
    }
    .overlay-card h2 {
      font-size: 1.4rem;
      color: #ff69b4;
      margin-bottom: 5px;
      font-style: italic;
    }
    .overlay-card p {
      font-size: 0.85rem;
      color: #e0e0e0;
      line-height: 1.3;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="overlay-card">
    <h2>Me Encantas</h2>
    <p>Si pudiera elegir un lugar seguro, sería a tu lado. INFINITO ∞</p>
  </div>

  <script>
    // Initialisation de la scène, de la caméra et du rendu
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050005, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -10, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 1. Création du cœur central en particules (Galaxie)
    const count = 8000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    const colorInside = new THREE.Color(0xff0055);
    const colorOutside = new THREE.Color(0xff69b4);

    for (let i = 0; i < count; i++) {
      // Équation paramétrique d'un cœur en 3D
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * Math.PI;

      // Base du cœur
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 10;

      // Dispersion tourbillonnante
      const scale = 0.5 + Math.random() * 0.8;
      x *= scale;
      y *= scale;
      z *= scale;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Dégradé de couleur
      const mixedColor = colorInside.clone().lerp(colorOutside, Math.random());
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Texture circulaire pour les particules
    const canvas = document.createElement('canvas');
    canvas.width = 16;
    canvas.height = 16;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(8,8,0, 8,8,8);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(8,8,8,0,Math.PI*2);
    ctx.fill();
    const pTexture = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 0.3,
      vertexColors: true,
      map: pTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const heartGalaxy = new THREE.Points(geometry, material);
    scene.add(heartGalaxy);

    // 2. Trou noir au centre
    const holeGeo = new THREE.SphereGeometry(1.2, 32, 32);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const blackHole = new THREE.Mesh(holeGeo, holeMat);
    scene.add(blackHole);

    // 3. Animation de rotation
    function animate() {
      requestAnimationFrame(animate);

      heartGalaxy.rotation.z += 0.002;
      heartGalaxy.rotation.y += 0.003;

      renderer.render(scene, camera);
    }
    animate();

    // Redimensionnement de la fenêtre
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
