<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galaxy of Love 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030005; font-family: 'Segoe UI', Arial, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    .overlay-card {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(15, 2, 20, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(216, 191, 216, 0.4);
      border-radius: 18px;
      padding: 16px 28px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 25px rgba(186, 85, 211, 0.3);
      max-width: 90%;
      width: 380px;
    }
    .overlay-card h2 { font-size: 1.5rem; color: #e6e6fa; margin-bottom: 6px; font-style: italic; }
    .overlay-card p { font-size: 0.85rem; color: #e5e5e5; line-height: 1.4; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="overlay-card">
    <h2>You Mean The World To Me</h2>
    <p>If I could choose a safe place, it would always be by your side. INFINITY ∞</p>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030005, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -16, 22);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Texture pour les particules avec une lueur lavande
    const canvas = document.createElement('canvas');
    canvas.width = 16; canvas.height = 16;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.4, 'rgba(216, 191, 216, 0.9)'); // Teinte Lavande
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(8, 8, 8, 0, Math.PI * 2); ctx.fill();
    const particleTexture = new THREE.CanvasTexture(canvas);

    // 1. LE GRAND CŒUR EN PARTICULES VIOLET LAVANDE
    const heartParticlesCount = 12000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartParticlesCount * 3);
    const heartColors = new Float32Array(heartParticlesCount * 3);

    // Nuances de violet lavande (du violet moyen au lavande très clair)
    const colorCore = new THREE.Color(0x9370db); // Medium Purple
    const colorEdge = new THREE.Color(0xe6e6fa); // Lavender

    for (let i = 0; i < heartParticlesCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * Math.PI;

      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 4;

      const factor = 0.45 + Math.random() * 0.1;
      x *= factor;
      y *= factor;
      z *= factor;

      heartPos[i * 3] = x;
      heartPos[i * 3 + 1] = y + 5; 
      heartPos[i * 3 + 2] = z;

      const c = colorCore.clone().lerp(colorEdge, Math.random());
      heartColors[i * 3] = c.r;
      heartColors[i * 3 + 1] = c.g;
      heartColors[i * 3 + 2] = c.b;
    }

    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartMat = new THREE.PointsMaterial({
      size: 0.35,
      vertexColors: true,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const heartMesh = new THREE.Points(heartGeo, heartMat);
    scene.add(heartMesh);

    // 2. GALAXIE & TROU NOIR
    const galaxyCount = 8000;
    const galaxyGeo = new THREE.BufferGeometry();
    const galaxyPos = new Float32Array(galaxyCount * 3);
    const galaxyColors = new Float32Array(galaxyCount * 3);

    const gColor1 = new THREE.Color(0x4b0082); // Indigo
    const gColor2 = new THREE.Color(0xba55d3); // Medium Orchid

    for (let i = 0; i < galaxyCount; i++) {
      const radius = 3 + Math.random() * 22;
      const spinAngle = radius * 0.4;
      const branchAngle = Math.random() * Math.PI * 2;

      const x = Math.cos(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 1.5;
      const y = Math.sin(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 1.5;
      const z = (Math.random() - 0.5) * 2;

      galaxyPos[i * 3] = x;
      galaxyPos[i * 3 + 1] = y - 4;
      galaxyPos[i * 3 + 2] = z - 2;

      const c = gColor1.clone().lerp(gColor2, Math.random());
      galaxyColors[i * 3] = c.r;
      galaxyColors[i * 3 + 1] = c.g;
      galaxyColors[i * 3 + 2] = c.b;
    }

    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPos, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

    const galaxyMat = new THREE.PointsMaterial({
      size: 0.25,
      vertexColors: true,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    galaxy.rotation.x = Math.PI / 2.3;
    scene.add(galaxy);

    const holeGeo = new THREE.SphereGeometry(2, 32, 32);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const blackHole = new THREE.Mesh(holeGeo, holeMat);
    blackHole.position.set(0, -4, -2);
    scene.add(blackHole);

    // 3. ANIMATION
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      const beat = 1 + Math.sin(elapsedTime * 3) * 0.05;
      heartMesh.scale.set(beat, beat, beat);
      heartMesh.rotation.y = Math.sin(elapsedTime * 0.5) * 0.15;

      galaxy.rotation.z -= 0.002;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
